# Split API roles: send the daemon surface to the `api-runtime` container while
# the browser surface keeps going to `api`. Merge these blocks into the
# enclosing server block (both the :80 and the :443 one) and keep
# `deploy/nginx/session-archive-direct.conf` in the same server block.
#
# Adjust the upstream port to REMI_API_RUNTIME_BIND_PORT for the host. Default
# is 16121, which is where compose.application.yml publishes api-runtime.

upstream multica_api_runtime { server 127.0.0.1:16121; keepalive 32; }

# 注意三点：
# 1) 用普通前缀，不用 ^~：^~ 会让下面归档直传的 regex 不再被评估。
# 2) 必须带尾斜杠：/api/daemons/:id（复数）是浏览器路由。
# 3) 本 location 不声明自己的 proxy_set_header，因此继承 server 级的
#    X-Remi-Archive-Direct-Route "" 清空与 Upgrade/Connection 头。
location /api/daemon/ {
    client_max_body_size 128m;          # 对齐 Next 的 proxyClientMaxBodySize，feishu-bot 多部件与 messages 批
    proxy_pass http://multica_api_runtime;
}
location /api/daemon/ws { proxy_pass http://multica_api_runtime; }   # 替换现有那一行的目标

# 现有归档直传 regex location 保持原样，只把 proxy_pass 改为 multica_api_runtime。
# 它必须留在本文件里、并且仍然用 `~` 普通正则：上面两条是普通前缀 location，
# 正则 location 优先于前缀 location，所以归档直传仍然赢。只有把上面任一条改成
# `^~` 才会让这个 regex 失效，那样 1g 的归档上传会整段落进 128m 的 daemon 前缀里。
# 具体内容见 session-archive-direct.conf：
#
#     location ~ ^/api/daemon/runtimes/[^/]+/issues/[^/]+/session-archives/[^/]+/content$ {
#         client_max_body_size 1g;
#         ...
#         proxy_pass http://multica_api_runtime;
#     }
#
# 不变：/ws、/api/realtime/ws、^~ /api/webhooks/scm/ → multica_api（ui）；/ → web。
# remi-block-retired-daemon.conf 的 deny 不受影响。
