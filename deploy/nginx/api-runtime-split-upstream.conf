# Split API roles, part 1 of 2: the `api-runtime` upstream.
#
# Include this file in the **http** context, i.e. from `http { ... }` in
# nginx.conf — not inside a server block. `upstream` is only valid there; putting
# it in a `server` block makes `nginx -t` fail with
# `"upstream" directive is not allowed here`.
#
# For example, with the site config in /etc/nginx/sites-enabled/remi.conf:
#
#     # /etc/nginx/nginx.conf
#     http {
#         include /etc/nginx/conf.d/api-runtime-split-upstream.conf;
#         ...
#     }
#
# Adjust the port to REMI_API_RUNTIME_BIND_PORT for the host. Default is 16121,
# which is where compose.application.yml publishes api-runtime on loopback.
# The companion file api-runtime-split-locations.conf goes in each public
# `server` block (the :80 and the :443 one).

upstream multica_api_runtime { server 127.0.0.1:16121; keepalive 32; }
