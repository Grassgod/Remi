# Include this location before any broader matching regex location, and verify
# that no covering ^~ prefix prevents regex evaluation. Ordinary prefix location
# order is irrelevant. Adjust the API port to REMI_API_BIND_PORT for the host.
#
# REQUIRED companion directive. Add this to the enclosing server block so a
# client cannot supply the route proof itself on a path that reaches the API
# through the Next.js compatibility rewrite:
#
#     proxy_set_header X-Remi-Archive-Direct-Route "";
#
# An empty value stops Nginx from passing the header upstream. Because
# proxy_set_header is inherited only by levels that declare none of their own,
# the location below still overrides it with the real proof. Without the
# server-level line the authority check is the only barrier left, and it is a
# no-op whenever the direct route shares the public host and port.
location ~ ^/api/daemon/runtimes/[^/]+/issues/[^/]+/session-archives/[^/]+/content$ {
    client_max_body_size 1g;
    client_body_timeout 15m;

    # Stream the request into the API. Buffering it here defeats the daemon's
    # streaming upload and can consume the proxy host's disk or memory.
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_connect_timeout 30s;
    proxy_send_timeout 15m;
    proxy_read_timeout 15m;

    # Preserve the public authority (including a non-default port) so the API
    # can match it against MULTIREMI_DAEMON_DIRECT_BASE_URL.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Only this direct location may inject the route proof. The API converts it
    # into the response marker after also checking the configured authority.
    proxy_set_header X-Remi-Archive-Direct-Route 1;
    proxy_pass http://127.0.0.1:16120;
}
