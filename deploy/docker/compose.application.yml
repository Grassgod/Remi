name: multiremi-platform-app

# Migration compose for installations where PostgreSQL and OpenViking already
# run in Docker. This stack owns only API/Web and joins their existing networks.
services:
  api:
    image: ${REMI_API_IMAGE:?set REMI_API_IMAGE}
    restart: unless-stopped
    env_file:
      - ${REMI_API_ENV_FILE:?set REMI_API_ENV_FILE}
    environment:
      HOME: /srv/multiremi
      REMI_RUNTIME_UID: ${REMI_RUNTIME_UID:-1000}
      REMI_RUNTIME_GID: ${REMI_RUNTIME_GID:-1000}
      MULTIREMI_HOST: 0.0.0.0
      MULTIREMI_PORT: 6120
      MULTIREMI_OPENVIKING_URL: http://openviking:1933
      MULTIREMI_UPLOAD_DIR: /srv/multiremi/uploads
      MULTIREMI_SESSION_ARCHIVE_ROOT: /srv/multiremi/session-archives
      MULTIREMI_BACKGROUND_JOBS: ${REMI_BACKGROUND_JOBS:-0}
      MULTIREMI_SSH_MESH_CONTROL_PLANE: 0
      MULTIREMI_SSH_MESH_CONTROL_PLANE_ROOT: /srv/multiremi/ssh-mesh
      # Operator-owned endpoint registry. Empty (the default) keeps Feishu
      # ingestion fail-closed. Only loopback values are meaningful here: the
      # sidecar shares this container's network namespace, so a name may not
      # point at an arbitrary host. This Compose value overrides the API env
      # file, which is why the registry is deployment configuration and never
      # a browser-submitted URL.
      MULTIREMI_FEISHU_SIDECAR_ENDPOINTS: ${REMI_FEISHU_SIDECAR_ENDPOINTS:-}
    volumes:
      - ${REMI_HOME_DIR:?set REMI_HOME_DIR}:/srv/multiremi
      - ${REMI_UPLOAD_DIR:?set REMI_UPLOAD_DIR}:/srv/multiremi/uploads
      - ${REMI_SESSION_ARCHIVE_ROOT:?set REMI_SESSION_ARCHIVE_ROOT}:/srv/multiremi/session-archives
      - ${REMI_SSH_MESH_ROOT:?set REMI_SSH_MESH_ROOT}:/srv/multiremi/ssh-mesh
    networks:
      - app
      - postgres
      - openviking
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:6120/readyz');process.exit(r.ok?0:1)"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - 127.0.0.1:${REMI_API_BIND_PORT:-16120}:6120

  # Feishu ingestion sidecar. It binds 8042 to loopback only and refuses a
  # non-loopback listener, so it shares the API container's network namespace
  # instead of joining a bridge network. It therefore must not declare `ports`,
  # `expose`, or `networks`: the namespace belongs to `api`, and any published
  # port would have to be declared there. Disabled unless
  # `COMPOSE_PROFILES=feishu-sidecar` is set, so existing installations are
  # unaffected. Because the namespace belongs to `api`, deployment automation
  # recreates this container whenever it replaces the API container.
  feishu-sidecar:
    profiles: ["feishu-sidecar"]
    image: ${REMI_FEISHU_SIDECAR_IMAGE:-multiremi-feishu-sidecar:set-REMI_FEISHU_SIDECAR_IMAGE}
    restart: unless-stopped
    network_mode: service:api
    depends_on:
      api:
        condition: service_started
    # The sidecar owns personal Feishu credentials. They live in its own data
    # volume, written by its first-run wizard — never in this file, the API env
    # file, or Git.
    volumes:
      - feishu-sidecar-data:/data
      - feishu-sidecar-home:/home/personal-automation
    shm_size: 512m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8042/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  ssh-mesh-control-plane:
    image: ${REMI_API_IMAGE:?set REMI_API_IMAGE}
    restart: unless-stopped
    network_mode: host
    env_file:
      - ${REMI_CONTROL_PLANE_ENV_FILE:?set REMI_CONTROL_PLANE_ENV_FILE}
    environment:
      HOME: /srv/multiremi
      USER: ${REMI_SSH_USER:?set REMI_SSH_USER}
      REMI_RUNTIME_UID: ${REMI_RUNTIME_UID:-1000}
      REMI_RUNTIME_GID: ${REMI_RUNTIME_GID:-1000}
      MULTIREMI_SSH_MESH_CONTROL_PLANE: ${REMI_SSH_MESH_CONTROL_PLANE:-0}
      MULTIREMI_SSH_MESH_CONTROL_PLANE_ROOT: /srv/multiremi/ssh-mesh
    hostname: ${REMI_CONTROL_PLANE_HOSTNAME:?set REMI_CONTROL_PLANE_HOSTNAME}
    command: ["bun", "run", "apps/server/ssh-mesh-control-plane.ts"]
    volumes:
      - ${REMI_HOME_DIR:?set REMI_HOME_DIR}:/srv/multiremi
      - ${REMI_SSH_MESH_ROOT:?set REMI_SSH_MESH_ROOT}:/srv/multiremi/ssh-mesh
      - ${REMI_SSH_HOME_DIR:?set REMI_SSH_HOME_DIR}:/srv/multiremi/.ssh
      - /etc/ssh:/etc/ssh:ro
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    image: ${REMI_WEB_IMAGE:?set REMI_WEB_IMAGE}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - 127.0.0.1:${REMI_WEB_BIND_PORT:-13000}:3000

volumes:
  # Named so an operator can point them at the volumes an existing
  # `personal-automation` deployment already uses. Never attach a volume that a
  # running container still owns.
  feishu-sidecar-data:
    name: ${REMI_FEISHU_SIDECAR_DATA_VOLUME:-multiremi-feishu-sidecar-data}
  feishu-sidecar-home:
    name: ${REMI_FEISHU_SIDECAR_HOME_VOLUME:-multiremi-feishu-sidecar-home}

networks:
  app:
  postgres:
    external: true
    name: ${REMI_POSTGRES_NETWORK:?set REMI_POSTGRES_NETWORK}
  openviking:
    external: true
    name: ${REMI_OPENVIKING_NETWORK:?set REMI_OPENVIKING_NETWORK}
