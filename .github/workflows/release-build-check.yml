name: Release build check

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/platform-release.yml"
      - ".github/workflows/release-build-check.yml"
      - "apps/**"
      - "cli-capabilities.json"
      - "bin/**"
      - "bun.lock"
      - "bunfig.toml"
      - "deploy/**"
      - "frontend/**"
      - "package.json"
      - "packages/**"
      - "scripts/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/platform-release.yml"
      - ".github/workflows/release-build-check.yml"
      - "apps/**"
      - "cli-capabilities.json"
      - "bin/**"
      - "bun.lock"
      - "bunfig.toml"
      - "deploy/**"
      - "frontend/**"
      - "package.json"
      - "packages/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  session-archive-platform:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies from the public registry
        run: bun install --registry https://registry.npmjs.org --frozen-lockfile --ignore-scripts

      - name: Verify native Issue session archive traversal
        run: bun test tests/unit/daemon/session-archive.test.ts

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies from the public registry
        run: bun install --registry https://registry.npmjs.org --frozen-lockfile --ignore-scripts

      - name: Build Multiremi daemon CLI release archives
        run: MULTIREMI_VERSION=v0.0.0-ci bun run build:multiremi

      - name: Verify CLI capability coverage and contracts
        run: |
          bun run cli:capabilities:check
          bun test tests/unit/multiremi/cli-capabilities-manifest.test.ts tests/unit/multiremi/multiremi-api-cli.test.ts tests/unit/multiremi/multiremi-cli-collaboration-auth.test.ts tests/unit/multiremi/multiremi-cli-agent-extensions-auth.test.ts tests/unit/multiremi/multiremi-cli-operations-auth.test.ts tests/unit/remi/cli-context.test.ts tests/unit/remi/cli-resources.test.ts tests/unit/remi/cli-collaboration.test.ts tests/unit/remi/cli-agent-extensions.test.ts tests/unit/remi/cli-operations.test.ts tests/unit/remi/cli-plugin-registry.test.ts

      # This workflow path-filters on `frontend/**` but used to build only the
      # server/CLI, so a broken web app went green. These two steps are the
      # gate for everything under frontend/.
      - name: Typecheck frontend packages and apps
        run: bun run typecheck:frontend

      - name: Test frontend packages and apps
        run: bun run test:frontend

      # Fast structural gates: package boundaries, contracts purity, and the
      # lockfile-registry guard (a mirror-polluted bun.lock passes the frozen
      # install above and only fails later at cold-cache download — this test
      # is the first gate that catches it).
      - name: Architecture guard tests
        run: bun test tests/arch/

      - uses: docker/setup-buildx-action@v3

      - name: Build platform API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.api
          push: false
          cache-from: type=gha,scope=platform-api-check
          cache-to: type=gha,scope=platform-api-check,mode=max

      - name: Build platform Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          push: false
          cache-from: type=gha,scope=platform-web-check
          cache-to: type=gha,scope=platform-web-check,mode=max
