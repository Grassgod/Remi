name: Release build check

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/platform-release.yml"
      - ".github/workflows/release-build-check.yml"
      - "apps/**"
      - "cli-capabilities.json"
      - "bin/**"
      - "bun.lock"
      - "bunfig.toml"
      - "deploy/**"
      - "docs/cli-command-migration.md"
      - "docs/cli-parity-acceptance.md"
      - "frontend/**"
      - "package.json"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "tsconfig.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/platform-release.yml"
      - ".github/workflows/release-build-check.yml"
      - "apps/**"
      - "cli-capabilities.json"
      - "bin/**"
      - "bun.lock"
      - "bunfig.toml"
      - "deploy/**"
      - "docs/cli-command-migration.md"
      - "docs/cli-parity-acceptance.md"
      - "frontend/**"
      - "package.json"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "tsconfig.json"
  # Full run on demand, e.g. `gh workflow run release-build-check.yml --ref main`
  # after the workflow was disabled and re-enabled: a main push only triggers
  # it when a later commit lands, and the release gate needs a run on the exact
  # SHA it tags. Runs the backend suite like a main push (MUL-516).
  workflow_dispatch:
    inputs:
      release_candidate:
        description: "Produce exact-version CLI and OCI candidates after full main validation"
        required: false
        type: boolean
        default: false
      retry_backend_run_id:
        description: "Completed full main run with only backend failures; retry those files after verifying unchanged source"
        required: false
        type: string

permissions:
  contents: read
  actions: read

# MUL-516: a new push to a pull request cancels that pull request's run still in
# progress — only the latest head is worth checking. Runs on main never cancel
# one another: each gets a group of its own, because the release gate needs a
# successful run for the exact main SHA it tags. A group shared by main pushes is
# not enough even without cancel-in-progress — GitHub keeps one pending run per
# group and cancels the older pending one when a third arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  session-archive-platform:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore Bun package downloads
        id: bun-download-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-1.3.14-${{ hashFiles('bun.lock') }}
      - name: Install dependencies from the public registry
        run: bun install --registry https://registry.npmjs.org --frozen-lockfile --ignore-scripts
      - name: Save trusted Bun package downloads
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.bun-download-cache.outputs.cache-hit != 'true' && matrix.os == 'macos-latest'
        uses: actions/cache/save@v4
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-1.3.14-${{ hashFiles('bun.lock') }}

      - name: Verify native Issue session archive traversal
        run: bun run test tests/unit/daemon/session-archive.test.ts

      - name: Verify pinned ACP bridges and bundled agent runtimes
        env:
          REMI_CLAUDE_AGENT_ACP_EXECUTABLE: ${{ github.workspace }}/bin/remi-claude-agent-acp
        run: REMI_HOME="$(mktemp -d)" bun run apps/remi/main.ts runtime prepare --provider claude --provider codex

      - name: Verify runtime installation through a symlinked home
        env:
          REMI_CLAUDE_AGENT_ACP_EXECUTABLE: ${{ github.workspace }}/bin/remi-claude-agent-acp
        run: |
          runtime_fixture="$(mktemp -d)"
          mkdir -p "$runtime_fixture/real-home/.remi"
          ln -s "$runtime_fixture/real-home" "$runtime_fixture/linked-home"
          REMI_HOME="$runtime_fixture/linked-home/.remi" bun run apps/remi/main.ts runtime prepare --provider claude --provider codex

  guards:
    runs-on: ubuntu-latest
    outputs:
      candidate: ${{ steps.candidate.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Restore Bun package downloads
        id: bun-download-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-1.3.14-${{ hashFiles('bun.lock') }}
      - name: Install dependencies from the public registry
        run: bun install --registry https://registry.npmjs.org --frozen-lockfile --ignore-scripts
      - name: Save trusted Bun package downloads
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.bun-download-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-1.3.14-${{ hashFiles('bun.lock') }}
      - name: Require refreshed dependencies for a new release version
        id: release
        env:
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run release:check --base-ref "${RELEASE_BASE_SHA:-$(git rev-parse HEAD^)}"
      - name: Reject invalid candidate requests
        if: inputs.release_candidate
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RETRY: ${{ inputs.retry_backend_run_id }}
        run: test "$EVENT" = workflow_dispatch && test "$REF" = refs/heads/main && test -z "$RETRY"
      - name: Select formal release candidate
        id: candidate
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RETRY: ${{ inputs.retry_backend_run_id }}
          REQUESTED: ${{ inputs.release_candidate }}
          VERSION_CHANGED: ${{ steps.release.outputs.version_changed }}
        run: |
          candidate=false
          if [ "$REF" = refs/heads/main ] && [ -z "$RETRY" ]; then
            if { [ "$EVENT" = push ] && [ "$VERSION_CHANGED" = true ]; } || { [ "$EVENT" = workflow_dispatch ] && [ "$REQUESTED" = true ]; }; then
              candidate=true
            fi
          fi
          echo "enabled=$candidate" >> "$GITHUB_OUTPUT"
      - name: Verify CLI capability coverage
        run: bun run cli:capabilities:check
      - name: CI orchestration regression tests
        env:
          CI: "true"
          GITHUB_ACTIONS: "true"
        run: >-
          bun run test tests/unit/scripts/ci-backend.test.ts
          tests/unit/scripts/run-tests.test.ts tests/unit/scripts/run-tests-signals.test.ts
          tests/unit/scripts/retry-failed-backend-tests.test.ts tests/unit/scripts/release-candidate.test.ts
      # Intentionally repeated in full backend discovery: early structural feedback.
      - name: Architecture guard tests
        run: bun run test tests/arch/

  frontend-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Restore Bun package downloads
        id: bun-download-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-1.3.14-${{ hashFiles('bun.lock') }}
      - name: Install dependencies from the public registry
        run: bun install --registry https://registry.npmjs.org --frozen-lockfile --ignore-scripts
      - run: bun run typecheck:frontend

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Restore Bun package downloads
        id: bun-download-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-1.3.14-${{ hashFiles('bun.lock') }}
      - name: Install dependencies from the public registry
        run: bun install --registry https://registry.npmjs.org --frozen-lockfile --ignore-scripts
      - run: bun run test:frontend

  cli-build:
    needs: guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Restore Bun package downloads
        id: bun-download-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-1.3.14-${{ hashFiles('bun.lock') }}
      - name: Install dependencies from the public registry
        run: bun install --registry https://registry.npmjs.org --frozen-lockfile --ignore-scripts
      - name: Build CLI archives
        env:
          CANDIDATE: ${{ needs.guards.outputs.candidate }}
        run: |
          version=v0.0.0-ci
          if [ "$CANDIDATE" = true ]; then
            version="v$(bun -p 'require("./package.json").version')"
            bun run release:check --tag "$version"
          fi
          MULTIREMI_VERSION="$version" bun run build:multiremi
          if [ "$CANDIDATE" = true ]; then
            mkdir -p candidate
            cp dist/*.tar.gz scripts/install-remi.sh candidate/
          fi
      - uses: actions/upload-artifact@v4
        if: needs.guards.outputs.candidate == 'true'
        with:
          name: candidate-cli
          path: candidate
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  api-build:
    needs: guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select image version
        id: version
        env:
          CANDIDATE: ${{ needs.guards.outputs.candidate }}
        run: |
          version=0.0.0-ci
          if [ "$CANDIDATE" = true ]; then
            version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
            mkdir -p candidate
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build platform api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.api
          push: false
          platforms: linux/amd64
          provenance: false
          outputs: ${{ needs.guards.outputs.candidate == 'true' && 'type=oci,dest=candidate/api.oci.tar,oci-mediatypes=true' || '' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=platform-api
          cache-to: type=gha,scope=platform-api,mode=max
          build-args: MULTIREMI_VERSION=v${{ steps.version.outputs.value }}
      - uses: actions/upload-artifact@v4
        if: needs.guards.outputs.candidate == 'true'
        with:
          name: candidate-api
          path: candidate/api.oci.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  web-build:
    needs: guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select image version
        id: version
        env:
          CANDIDATE: ${{ needs.guards.outputs.candidate }}
        run: |
          version=0.0.0-ci
          if [ "$CANDIDATE" = true ]; then
            version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
            mkdir -p candidate
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build platform web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          push: false
          platforms: linux/amd64
          provenance: false
          outputs: ${{ needs.guards.outputs.candidate == 'true' && 'type=oci,dest=candidate/web.oci.tar,oci-mediatypes=true' || '' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=platform-web
          cache-to: type=gha,scope=platform-web,mode=max
          build-args: |
            REMI_APP_VERSION=${{ steps.version.outputs.value }}
            NEXT_PUBLIC_APP_VERSION=${{ steps.version.outputs.value }}
      - uses: actions/upload-artifact@v4
        if: needs.guards.outputs.candidate == 'true'
        with:
          name: candidate-web
          path: candidate/web.oci.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  backend-plan:
    if: github.event_name != 'pull_request' && !inputs.retry_backend_run_id
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun run scripts/ci-backend.ts plan --sha "$GITHUB_SHA" --shards 4 --out ci-backend/plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: backend-plan
          path: ci-backend/plan.json
          if-no-files-found: error

  backend:
    needs: backend-plan
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: multimira
          POSTGRES_PASSWORD: multimira
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U multimira -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Restore Bun package downloads
        id: bun-download-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-1.3.14-${{ hashFiles('bun.lock') }}
      - name: Install dependencies from the public registry
        run: bun install --registry https://registry.npmjs.org --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: backend-plan
          path: ci-backend
      - name: Backend test shard
        env:
          MULTIREMI_TEST_POSTGRES_URL: postgres://multimira:multimira@localhost:5432/postgres
          MULTIREMI_TEST_LOCK_ORDER_SENTINEL: "1"
        run: bun run scripts/ci-backend.ts run --plan ci-backend/plan.json --shard ${{ matrix.shard }} --out ci-backend/shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-shard-${{ matrix.shard }}
          path: ci-backend/shard-${{ matrix.shard }}.json
          if-no-files-found: error

  backend-evidence:
    needs: [backend-plan, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@v4
        with:
          pattern: backend-*
          path: ci-backend
          merge-multiple: true
      - run: bun run scripts/ci-backend.ts verify --plan ci-backend/plan.json --reports ci-backend --out ci-backend/coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: ci-backend/coverage.json
          if-no-files-found: error

  backend-retry:
    if: github.event_name == 'workflow_dispatch' && inputs.retry_backend_run_id != ''
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: multimira
          POSTGRES_PASSWORD: multimira
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U multimira -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Restore Bun package downloads
        id: bun-download-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-1.3.14-${{ hashFiles('bun.lock') }}
      - name: Install dependencies from the public registry
        run: bun install --registry https://registry.npmjs.org --frozen-lockfile --ignore-scripts
      # Both old full-suite logs and complete sharded artifacts are verified.
      # Partial runs, infrastructure failures and previous retries are rejected.
      - name: Verify baseline and retry failed backend files
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_BACKEND_RUN_ID: ${{ inputs.retry_backend_run_id }}
          MULTIREMI_TEST_POSTGRES_URL: postgres://multimira:multimira@localhost:5432/postgres
          MULTIREMI_TEST_LOCK_ORDER_SENTINEL: "1"
        run: bun run scripts/retry-failed-backend-tests.ts "$RETRY_BACKEND_RUN_ID"
      - name: Record verified retry mode
        run: |
          mkdir -p ci-backend
          printf '{"mode":"verified-retry","sha":"%s","baselineRunId":"%s","fullSuite":false}\n' "$GITHUB_SHA" "${{ inputs.retry_backend_run_id }}" > ci-backend/retry.json
      - uses: actions/upload-artifact@v4
        with:
          name: backend-verified-retry
          path: |
            ci-backend/retry.json
            ci-backend/retry-evidence.json
          if-no-files-found: error

  # Preserve the branch-protection check. No failed/cancelled/unexpected skipped
  # dependency can become a green full-run release gate.
  build:
    if: always()
    needs: [guards, frontend-types, frontend-tests, cli-build, api-build, web-build, session-archive-platform, frontend-zero-jump, frontend-replica, backend-plan, backend, backend-evidence, backend-retry]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable check
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          RETRY: ${{ inputs.retry_backend_run_id }}
          REF: ${{ github.ref }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          results = {k: v['result'] for k,v in json.loads(os.environ['RESULTS']).items()}
          skipped = {'backend-plan', 'backend', 'backend-evidence', 'backend-retry'}
          if os.environ['EVENT'] == 'pull_request':
              mode = 'pr-fast'
          elif os.environ['RETRY']:
              assert os.environ['EVENT'] == 'workflow_dispatch' and os.environ['REF'] == 'refs/heads/main'
              mode = 'verified-retry'
              skipped.remove('backend-retry')
          else:
              mode = 'full'
              skipped = {'backend-retry'}
          for job, result in results.items():
              expected = 'skipped' if job in skipped else 'success'
              assert result == expected, f'{job}: {result}, expected {expected}'
          print(json.dumps({'mode': mode, 'sha': os.environ['GITHUB_SHA'], 'results': results}))
          PYCODE

  candidate-package:
    needs: [build, guards]
    if: needs.guards.outputs.candidate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: candidate
          merge-multiple: true
      - run: bun run scripts/release-candidate.ts create --dir candidate --base-ref "$RELEASE_BASE_SHA"
        env:
          RELEASE_BASE_SHA: ${{ github.event.before }}
          RELEASE_CANDIDATE_REQUEST: ${{ inputs.release_candidate }}
          RETRY_BACKEND_RUN_ID: ${{ inputs.retry_backend_run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: candidate/release-candidate.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  # MUL-394 (MUL-383 S7): open an Issue detail page in a real browser and fail if
  # the content moves during load. Structural assertions only, so the gate is
  # about jumps and never about milliseconds.
  #
  # Its own job, not a step in `build`: it needs a Chromium download and several
  # minutes, and a failure should name the check in the Actions list.
  #
  # Path filter: the workflow's trigger-level filter is repo-wide by design (a
  # pull request touching `frontend/**` runs the whole gate). This job is the one
  # that would be pure waste on, say, a daemon-only change, so it is skipped
  # explicitly unless frontend, the server it proxies, or the check itself moved.
  # `always()` is deliberately not used on the conditions below: a skipped
  # dependency must not run them.
  frontend-zero-jump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # `fetch-depth: 0` is what makes the change detector below real: the
      # default shallow clone does not contain the base commit, so `git diff`
      # against it fails and the step would fall back to "run" on every pull
      # request — spending a Chromium download and a Next build on, say, a
      # daemon-only change.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect whether this job has anything to check
        id: relevant
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Paths that change what this check measures:
          #   - `frontend/` — the check drives a production Next build of it;
          #   - `packages/server/` — it starts that API in-process;
          #   - every workspace package reachable from `packages/server`, which is
          #     what a change there can alter without touching either of the two
          #     above. Computed by following the import graph, not guessed:
          #     `packages/contracts`, `packages/daemon`, `packages/shared`,
          #     `packages/connectors`, `packages/acp` are imported directly, and
          #     `packages/plugin-sdk` arrives through `packages/daemon`
          #     (`agent-runtime/plugins/registry.ts`). `packages/auth` is
          #     reachable from nothing here — only `packages/remi` and
          #     `apps/remi` import it — so it stays out;
          #   - this workflow, `bun.lock` and the root `package.json`: a Next or
          #     Playwright bump changes the result without touching frontend
          #     sources. Scoped to this workflow on purpose — a change to some
          #     other workflow cannot alter what this job measures.
          relevant='^(\.github/workflows/release-build-check\.yml|frontend/|packages/server/|packages/contracts/|packages/daemon/|packages/shared/|packages/connectors/|packages/acp/|packages/plugin-sdk/|tests/integration/zero-jump|tests/fixtures/multiremi/|reports/performance/MUL-394-zero-jump|bun\.lock|package\.json)'
          if [ "$EVENT_NAME" != "pull_request" ] && [ "$EVENT_NAME" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${BASE_SHA:-}" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)"
          echo "$changed" | sed 's/^/  changed: /'
          if echo "$changed" | grep -qE "$relevant"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no frontend/server change; skipping the zero-jump check"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.relevant.outputs.run == 'true'
        with:
          bun-version: 1.3.14

      - name: Restore Bun package downloads
        if: steps.relevant.outputs.run == 'true'
        id: bun-download-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-1.3.14-${{ hashFiles('bun.lock') }}
      - name: Install dependencies from the public registry
        if: steps.relevant.outputs.run == 'true'
        run: bun install --registry https://registry.npmjs.org --frozen-lockfile --ignore-scripts

      # The check drives the production build, and Next bakes the `/api/*`
      # rewrite destination into the routes manifest at build time, so it builds
      # the web app itself after it knows its API port. Restoring `.next/cache`
      # keeps that mandatory build near the cost of an incremental one.
      - name: Cache the Next build cache
        if: steps.relevant.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: frontend/apps/web/.next/cache
          key: zero-jump-next-${{ runner.os }}-${{ hashFiles('bun.lock', 'frontend/**') }}
          restore-keys: |
            zero-jump-next-${{ runner.os }}-

      - name: Install Chromium for Playwright
        if: steps.relevant.outputs.run == 'true'
        run: bunx playwright install chromium --with-deps

      - name: Zero-jump check (allowlist mode)
        if: steps.relevant.outputs.run == 'true'
        # The failure frames go to a path this workflow owns, not the runner's
        # `/tmp`: the upload step below has to read the same directory the check
        # wrote.
        env:
          MUL394_ZERO_JUMP_SHOT_DIR: ${{ runner.temp }}/mul394-zero-jump
        run: bun run tests/integration/zero-jump-check.ts --out reports/performance/MUL-394-zero-jump-ci.json

      # `always()`: the artifact is what lets a reviewer see the debt the
      # allowlist describes without re-running strict locally, so it is uploaded
      # on success and failure alike. Screenshots exist only for failing rounds,
      # so the second upload is naturally failure-only.
      - name: Upload the zero-jump report
        if: always() && steps.relevant.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zero-jump-report
          path: reports/performance/MUL-394-zero-jump-ci.json
          if-no-files-found: warn

      - name: Upload failure-frame screenshots
        if: failure() && steps.relevant.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zero-jump-failure-frames
          path: ${{ runner.temp }}/mul394-zero-jump/*.png
          if-no-files-found: warn

  # MUL-442 (MUL-403 C7): the browser replica, in a real browser. Three tabs of
  # one context must produce one subscription, a killed leader must be replaced
  # within a second with a continuous head, an offline tab must catch up without
  # re-reading the log, and the same suite must pass with OPFS switched off.
  #
  # Its own job for the same reason `frontend-zero-jump` is one: it needs a
  # Chromium download and a browser run, and a failure should name it in the
  # Actions list. The checks themselves are in
  # `tests/integration/replica-fixture/run.ts`, which serves its own origin and
  # mocks C3's socket from C0's contract — no server or database to arrange.
  frontend-replica:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Same reason as the zero-jump job: the change detector diffs against the
      # base commit, which a shallow clone does not contain.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect whether this job has anything to check
        id: relevant
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # What can change the replica's behaviour: the replica itself, the
          # check that drives it, the C0 contract whose frames it speaks, the
          # sqlite-wasm dependency, and this workflow. Scoped to the replica so a
          # daemon-only change does not pay for a Chromium download.
          relevant='^(\.github/workflows/release-build-check\.yml|frontend/packages/core/replica/|frontend/packages/core/package\.json|packages/contracts/src/live-hub\.ts|tests/integration/replica-fixture/|reports/performance/MUL-442-replica|bun\.lock|package\.json)'
          if [ "$EVENT_NAME" != "pull_request" ] && [ "$EVENT_NAME" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${BASE_SHA:-}" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)"
          echo "$changed" | sed 's/^/  changed: /'
          if echo "$changed" | grep -qE "$relevant"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no replica change; skipping the replica check"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.relevant.outputs.run == 'true'
        with:
          bun-version: 1.3.14

      - name: Restore Bun package downloads
        if: steps.relevant.outputs.run == 'true'
        id: bun-download-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-1.3.14-${{ hashFiles('bun.lock') }}
      - name: Install dependencies from the public registry
        if: steps.relevant.outputs.run == 'true'
        run: bun install --registry https://registry.npmjs.org --frozen-lockfile --ignore-scripts

      - name: Install Chromium for Playwright
        if: steps.relevant.outputs.run == 'true'
        run: bunx playwright install chromium --with-deps

      - name: Replica check
        if: steps.relevant.outputs.run == 'true'
        run: bun run tests/integration/replica-fixture/run.ts --out reports/performance/MUL-442-replica-ci.json

      # Uploaded on success and failure alike: the report is the evidence a
      # reviewer reads, and it names which criterion failed when one does.
      - name: Upload the replica report
        if: always() && steps.relevant.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: replica-report
          path: reports/performance/MUL-442-replica-ci.json
          if-no-files-found: warn
