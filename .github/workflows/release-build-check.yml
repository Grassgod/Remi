name: Release build check

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-build-check.yml"
      - "apps/**"
      - "bin/**"
      - "bun.lock"
      - "bunfig.toml"
      - "frontend/**"
      - "package.json"
      - "packages/**"
      - "scripts/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-build-check.yml"
      - "apps/**"
      - "bin/**"
      - "bun.lock"
      - "bunfig.toml"
      - "frontend/**"
      - "package.json"
      - "packages/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies from the public registry
        run: bun install --registry https://registry.npmjs.org --frozen-lockfile --ignore-scripts

      - name: Build release archive
        run: REMI_VERSION=0.0.0-ci bun run build

      - name: Build Multiremi daemon CLI release archives
        run: MULTIREMI_VERSION=v0.0.0-ci bun run build:multiremi
