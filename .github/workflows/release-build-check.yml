name: Release build check

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/platform-release.yml"
      - ".github/workflows/release-build-check.yml"
      - "apps/**"
      - "cli-capabilities.json"
      - "bin/**"
      - "bun.lock"
      - "bunfig.toml"
      - "deploy/**"
      - "docs/cli-command-migration.md"
      - "docs/cli-parity-acceptance.md"
      - "frontend/**"
      - "package.json"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "tsconfig.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/platform-release.yml"
      - ".github/workflows/release-build-check.yml"
      - "apps/**"
      - "cli-capabilities.json"
      - "bin/**"
      - "bun.lock"
      - "bunfig.toml"
      - "deploy/**"
      - "docs/cli-command-migration.md"
      - "docs/cli-parity-acceptance.md"
      - "frontend/**"
      - "package.json"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "tsconfig.json"
  # Full run on demand, e.g. `gh workflow run release-build-check.yml --ref main`
  # after the workflow was disabled and re-enabled: a main push only triggers
  # it when a later commit lands, and the release gate needs a run on the exact
  # SHA it tags. Runs the backend suite like a main push (MUL-516).
  workflow_dispatch:

permissions:
  contents: read

# MUL-516: a new push to a pull request cancels that pull request's run still in
# progress — only the latest head is worth checking. Runs on main never cancel
# one another: each gets a group of its own, because the release gate needs a
# successful run for the exact main SHA it tags. A group shared by main pushes is
# not enough even without cancel-in-progress — GitHub keeps one pending run per
# group and cancels the older pending one when a third arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  session-archive-platform:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies from the public registry
        run: bun install --registry https://registry.npmjs.org --frozen-lockfile --ignore-scripts

      - name: Verify native Issue session archive traversal
        run: bun test tests/unit/daemon/session-archive.test.ts

      - name: Verify pinned ACP bridges and bundled agent runtimes
        env:
          REMI_CLAUDE_AGENT_ACP_EXECUTABLE: ${{ github.workspace }}/bin/remi-claude-agent-acp
        run: REMI_HOME="$(mktemp -d)" bun run apps/remi/main.ts runtime prepare --provider claude --provider codex

      - name: Verify runtime installation through a symlinked home
        env:
          REMI_CLAUDE_AGENT_ACP_EXECUTABLE: ${{ github.workspace }}/bin/remi-claude-agent-acp
        run: |
          runtime_fixture="$(mktemp -d)"
          mkdir -p "$runtime_fixture/real-home/.remi"
          ln -s "$runtime_fixture/real-home" "$runtime_fixture/linked-home"
          REMI_HOME="$runtime_fixture/linked-home/.remi" bun run apps/remi/main.ts runtime prepare --provider claude --provider codex

  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: multimira
          POSTGRES_PASSWORD: multimira
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U multimira -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # A manual dispatch carries neither base, so it compares against the
      # parent commit — the previous main for a merge commit.
      - name: Require refreshed dependencies for a new release version
        env:
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run release:check --base-ref "${RELEASE_BASE_SHA:-$(git rev-parse HEAD^)}"

      - name: Install dependencies from the public registry
        run: bun install --registry https://registry.npmjs.org --frozen-lockfile --ignore-scripts

      - name: Build Multiremi daemon CLI release archives
        run: MULTIREMI_VERSION=v0.0.0-ci bun run build:multiremi

      - name: Verify CLI capability coverage
        run: bun run cli:capabilities:check

      # Fast structural gates, kept ahead of the full suite so a boundary or
      # lockfile break fails in seconds: package boundaries, contracts purity,
      # and the lockfile-registry guard (a mirror-polluted bun.lock passes the
      # frozen install above and only fails later at cold-cache download — this
      # test is the first gate that catches it). These files run again as part
      # of the full suite below; the duplication buys the fast failure.
      - name: Architecture guard tests
        run: bun test tests/arch/

      # This step used to enumerate ~20 test files by hand, so anything outside
      # the list never ran in CI — tests/unit/multiremi/multiremi-api-auth.test.ts
      # failed on main from 5e8ee09f onward while this workflow stayed green
      # (MUL-128/MUL-129). Run the whole backend suite instead: `bunfig.toml`
      # scopes `bun test` to `tests/`, so this is every `tests/**/*.test.ts`.
      # Harnesses needing real providers/browsers/Postgres are named `*.ts`
      # without `.test` and stay out of discovery — see TESTING.md.
      #
      # MUL-516: pull requests skip this step. The suite runs serially and takes
      # ~75 of the job's ~88 minutes, and it re-ran on every push to every pull
      # request. It runs on every push to main (and on a manual run) instead,
      # and the release gate (`release.yml` / `platform-release.yml`) only
      # accepts a successful main push or manual run on main for the tagged
      # SHA, so nothing ships without it. Only the
      # step is skipped, not the job: `build` still reports, so a required check
      # never sits pending. A red suite on main is traced to its merge and fixed
      # or reverted the same day — see TESTING.md.
      - name: Backend test suite
        if: github.event_name != 'pull_request'
        # The Postgres service container above is only reachable if the suite is
        # told where it is. Without this the PG integration tests fall back to a
        # default URL, which happens to match the service container here -- but a
        # developer or agent session with no local Postgres got a silent skip of
        # the entire PG bridge layer (MUL-357 QA). Declare it explicitly so the
        # intended target is in the workflow, not in a coincidence.
        env:
          MULTIREMI_TEST_POSTGRES_URL: postgres://multimira:multimira@localhost:5432/postgres
          # MUL-405 whole-suite lock-order sentinel. The bun test preload turns it
          # on by default; declared here so the gate is visible in the workflow
          # rather than only inside the preload. It reads the first lock class of
          # every outermost transaction and fails any W -> N -> D inversion.
          MULTIREMI_TEST_LOCK_ORDER_SENTINEL: "1"
        run: bun test

      # This workflow path-filters on `frontend/**` but used to build only the
      # server/CLI, so a broken web app went green. These two steps are the
      # gate for everything under frontend/.
      - name: Typecheck frontend packages and apps
        run: bun run typecheck:frontend

      - name: Test frontend packages and apps
        run: bun run test:frontend

      - uses: docker/setup-buildx-action@v3

      - name: Build platform API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.api
          build-args: MULTIREMI_VERSION=v0.0.0-ci
          push: false
          cache-from: type=gha,scope=platform-api-check
          cache-to: type=gha,scope=platform-api-check,mode=max

      - name: Build platform Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          push: false
          cache-from: type=gha,scope=platform-web-check
          cache-to: type=gha,scope=platform-web-check,mode=max

  # MUL-394 (MUL-383 S7): open an Issue detail page in a real browser and fail if
  # the content moves during load. Structural assertions only, so the gate is
  # about jumps and never about milliseconds.
  #
  # Its own job, not a step in `build`: it needs a Chromium download and several
  # minutes, and a failure should name the check in the Actions list.
  #
  # Path filter: the workflow's trigger-level filter is repo-wide by design (a
  # pull request touching `frontend/**` runs the whole gate). This job is the one
  # that would be pure waste on, say, a daemon-only change, so it is skipped
  # explicitly unless frontend, the server it proxies, or the check itself moved.
  # `always()` is deliberately not used on the conditions below: a skipped
  # dependency must not run them.
  frontend-zero-jump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # `fetch-depth: 0` is what makes the change detector below real: the
      # default shallow clone does not contain the base commit, so `git diff`
      # against it fails and the step would fall back to "run" on every pull
      # request — spending a Chromium download and a Next build on, say, a
      # daemon-only change.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect whether this job has anything to check
        id: relevant
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Paths that change what this check measures:
          #   - `frontend/` — the check drives a production Next build of it;
          #   - `packages/server/` — it starts that API in-process;
          #   - every workspace package reachable from `packages/server`, which is
          #     what a change there can alter without touching either of the two
          #     above. Computed by following the import graph, not guessed:
          #     `packages/contracts`, `packages/daemon`, `packages/shared`,
          #     `packages/connectors`, `packages/acp` are imported directly, and
          #     `packages/plugin-sdk` arrives through `packages/daemon`
          #     (`agent-runtime/plugins/registry.ts`). `packages/auth` is
          #     reachable from nothing here — only `packages/remi` and
          #     `apps/remi` import it — so it stays out;
          #   - this workflow, `bun.lock` and the root `package.json`: a Next or
          #     Playwright bump changes the result without touching frontend
          #     sources. Scoped to this workflow on purpose — a change to some
          #     other workflow cannot alter what this job measures.
          relevant='^(\.github/workflows/release-build-check\.yml|frontend/|packages/server/|packages/contracts/|packages/daemon/|packages/shared/|packages/connectors/|packages/acp/|packages/plugin-sdk/|tests/integration/zero-jump|tests/fixtures/multiremi/|reports/performance/MUL-394-zero-jump|bun\.lock|package\.json)'
          if [ "$EVENT_NAME" != "pull_request" ] && [ "$EVENT_NAME" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${BASE_SHA:-}" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)"
          echo "$changed" | sed 's/^/  changed: /'
          if echo "$changed" | grep -qE "$relevant"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no frontend/server change; skipping the zero-jump check"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.relevant.outputs.run == 'true'
        with:
          bun-version: 1.3.14

      - name: Install dependencies from the public registry
        if: steps.relevant.outputs.run == 'true'
        run: bun install --registry https://registry.npmjs.org --frozen-lockfile --ignore-scripts

      # The check drives the production build, and Next bakes the `/api/*`
      # rewrite destination into the routes manifest at build time, so it builds
      # the web app itself after it knows its API port. Restoring `.next/cache`
      # keeps that mandatory build near the cost of an incremental one.
      - name: Cache the Next build cache
        if: steps.relevant.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: frontend/apps/web/.next/cache
          key: zero-jump-next-${{ runner.os }}-${{ hashFiles('bun.lock', 'frontend/**') }}
          restore-keys: |
            zero-jump-next-${{ runner.os }}-

      - name: Install Chromium for Playwright
        if: steps.relevant.outputs.run == 'true'
        run: bunx playwright install chromium --with-deps

      - name: Zero-jump check (allowlist mode)
        if: steps.relevant.outputs.run == 'true'
        # The failure frames go to a path this workflow owns, not the runner's
        # `/tmp`: the upload step below has to read the same directory the check
        # wrote.
        env:
          MUL394_ZERO_JUMP_SHOT_DIR: ${{ runner.temp }}/mul394-zero-jump
        run: bun run tests/integration/zero-jump-check.ts --out reports/performance/MUL-394-zero-jump-ci.json

      # `always()`: the artifact is what lets a reviewer see the debt the
      # allowlist describes without re-running strict locally, so it is uploaded
      # on success and failure alike. Screenshots exist only for failing rounds,
      # so the second upload is naturally failure-only.
      - name: Upload the zero-jump report
        if: always() && steps.relevant.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zero-jump-report
          path: reports/performance/MUL-394-zero-jump-ci.json
          if-no-files-found: warn

      - name: Upload failure-frame screenshots
        if: failure() && steps.relevant.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zero-jump-failure-frames
          path: ${{ runner.temp }}/mul394-zero-jump/*.png
          if-no-files-found: warn

  # MUL-442 (MUL-403 C7): the browser replica, in a real browser. Three tabs of
  # one context must produce one subscription, a killed leader must be replaced
  # within a second with a continuous head, an offline tab must catch up without
  # re-reading the log, and the same suite must pass with OPFS switched off.
  #
  # Its own job for the same reason `frontend-zero-jump` is one: it needs a
  # Chromium download and a browser run, and a failure should name it in the
  # Actions list. The checks themselves are in
  # `tests/integration/replica-fixture/run.ts`, which serves its own origin and
  # mocks C3's socket from C0's contract — no server or database to arrange.
  frontend-replica:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Same reason as the zero-jump job: the change detector diffs against the
      # base commit, which a shallow clone does not contain.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect whether this job has anything to check
        id: relevant
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # What can change the replica's behaviour: the replica itself, the
          # check that drives it, the C0 contract whose frames it speaks, the
          # sqlite-wasm dependency, and this workflow. Scoped to the replica so a
          # daemon-only change does not pay for a Chromium download.
          relevant='^(\.github/workflows/release-build-check\.yml|frontend/packages/core/replica/|frontend/packages/core/package\.json|packages/contracts/src/live-hub\.ts|tests/integration/replica-fixture/|reports/performance/MUL-442-replica|bun\.lock|package\.json)'
          if [ "$EVENT_NAME" != "pull_request" ] && [ "$EVENT_NAME" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${BASE_SHA:-}" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)"
          echo "$changed" | sed 's/^/  changed: /'
          if echo "$changed" | grep -qE "$relevant"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no replica change; skipping the replica check"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.relevant.outputs.run == 'true'
        with:
          bun-version: 1.3.14

      - name: Install dependencies from the public registry
        if: steps.relevant.outputs.run == 'true'
        run: bun install --registry https://registry.npmjs.org --frozen-lockfile --ignore-scripts

      - name: Install Chromium for Playwright
        if: steps.relevant.outputs.run == 'true'
        run: bunx playwright install chromium --with-deps

      - name: Replica check
        if: steps.relevant.outputs.run == 'true'
        run: bun run tests/integration/replica-fixture/run.ts --out reports/performance/MUL-442-replica-ci.json

      # Uploaded on success and failure alike: the report is the evidence a
      # reviewer reads, and it names which criterion failed when one does.
      - name: Upload the replica report
        if: always() && steps.relevant.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: replica-report
          path: reports/performance/MUL-442-replica-ci.json
          if-no-files-found: warn
