name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Validate prepared release and successful full CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bun run release:check --tag "$GITHUB_REF_NAME"
          SHA="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$SHA" origin/main
          SUCCESS_RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release-build-check.yml/runs?head_sha=$SHA&event=push&branch=main&status=success&per_page=1" --jq '.total_count')"
          test "$SUCCESS_RUNS" -ge 1

      - name: Install dependencies from the public registry
        run: bun install --registry https://registry.npmjs.org --frozen-lockfile --ignore-scripts

      - name: Build Multiremi daemon CLI release archives
        run: MULTIREMI_VERSION="${GITHUB_REF_NAME}" bun run build:multiremi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            scripts/install-remi.sh
          generate_release_notes: true

  platform:
    needs: release
    uses: ./.github/workflows/platform-release.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
