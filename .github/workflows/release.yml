name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if bun install \
              --registry https://registry.npmjs.org \
              --frozen-lockfile \
              --ignore-scripts; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Dependency install failed (attempt $attempt/3); retrying in 10 seconds..."
              sleep 10
            fi
          done

          exit 1

      - name: Build release archive
        run: bun run build

      - name: Build Multiremi daemon CLI release archives
        run: MULTIREMI_VERSION="${GITHUB_REF_NAME}" bun run build:multiremi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            scripts/install.sh
            scripts/install-remi.sh
          generate_release_notes: true
