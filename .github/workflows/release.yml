name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Validate prepared release and main ancestry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bun run release:check --tag "$GITHUB_REF_NAME"
          SHA="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$SHA" origin/main
          # Candidate resolution independently requires full main-SHA CI or a strictly verified retry.

      - name: Resolve and verify formal release candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run scripts/release-candidate.ts resolve --kind cli --dir candidate --sha "$(git rev-parse HEAD)"

      - name: Install dependencies from the public registry
        if: steps.candidate.outputs.reused != 'true'
        run: bun install --registry https://registry.npmjs.org --frozen-lockfile --ignore-scripts

      - name: Build Multiremi daemon CLI release archives
        if: steps.candidate.outputs.reused != 'true'
        run: MULTIREMI_VERSION="${GITHUB_REF_NAME}" bun run build:multiremi

      - name: Reuse checked candidate CLI archives
        if: steps.candidate.outputs.reused == 'true'
        run: |
          mkdir -p dist
          cp candidate/remi-*.tar.gz dist/
          cmp candidate/install-remi.sh scripts/install-remi.sh

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            scripts/install-remi.sh
          generate_release_notes: true

  platform:
    needs: release
    uses: ./.github/workflows/platform-release.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: write
      actions: read
      packages: write
      attestations: write
      id-token: write
